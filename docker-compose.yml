services:
  redis:
    image: redis:7-alpine
    container_name: myvoice-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: myvoice:latest
    container_name: myvoice-app
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      REDIS_URL: "redis://redis:6379"
      # 覆盖 .env 中的 Windows 路径，容器内使用系统 Python 和 Linux 路径
      PYTHON_BIN: "python"
      MODELSCOPE_CACHE: "/root/.cache/modelscope"
    volumes:
      - whisper_cache:/root/.cache/huggingface
      - modelscope_cache:/root/.cache/modelscope
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  whisper_cache:
  modelscope_cache:
