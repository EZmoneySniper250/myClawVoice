services:
  redis:
    image: redis:7-alpine
    container_name: myvoice-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    image: myvoice:latest
    container_name: myvoice-app
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      REDIS_URL: "redis://redis:6379"
    volumes:
      # 缓存 faster-whisper / HuggingFace 模型，避免每次重建都重新下载
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  whisper_cache:
