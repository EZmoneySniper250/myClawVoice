services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis

volumes:
  redis_data:
